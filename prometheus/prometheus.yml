global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"

    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "examenfinal-app"

    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "app1:5000"
          - "app2:5000"