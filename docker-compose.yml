services:

  app1:
    build:
      context: ./app
    image: examenfinal-app:1.0.0
    container_name: examenfinal-app-01
    environment:
      APP_NAME: Examen-Final-App
      APP_VERSION: 1.0.0
      INSTANCE_NAME: app-01
    networks:
      - examenfinal-net
    restart: unless-stopped

  app2:
    build:
      context: ./app
    image: examenfinal-app:1.0.0
    container_name: examenfinal-app-02
    environment:
      APP_NAME: Examen-Final-App
      APP_VERSION: 1.0.0
      INSTANCE_NAME: app-02
    networks:
      - examenfinal-net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: examenfinal-nginx:1.0.0
    container_name: examenfinal-nginx
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
    networks:
      - examenfinal-net
    restart: unless-stopped

networks:

  examenfinal-net:
    name: examenfinal-net
    driver: bridge