services:

  app1:
    build:
      context: ./app
    image: examenfinal-app:1.0.0
    container_name: examenfinal-app-01
    environment:
      APP_NAME: Examen-Final-App
      APP_VERSION: 1.0.0
      INSTANCE_NAME: app-01
    networks:
      - examenfinal-net
    restart: unless-stopped

  app2:
    build:
      context: ./app
    image: examenfinal-app:1.0.0
    container_name: examenfinal-app-02
    environment:
      APP_NAME: Examen-Final-App
      APP_VERSION: 1.0.0
      INSTANCE_NAME: app-02
    networks:
      - examenfinal-net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: examenfinal-nginx:1.0.0
    container_name: examenfinal-nginx
    ports:
      - "80:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - examenfinal-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: examenfinal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - examenfinal-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: examenfinal-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - examenfinal-net
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: examenfinal-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - examenfinal-net
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: examenfinal-kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - examenfinal-net
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: examenfinal-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    networks:
      - examenfinal-net
    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
    image: examenfinal-jenkins:1.0.0
    container_name: examenfinal-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    networks:
      - examenfinal-net
    restart: unless-stopped


networks:
  examenfinal-net:
    name: examenfinal-net
    driver: bridge

volumes:
  prometheus-data:
    name: examenfinal-prometheus-data

  grafana-data:
    name: examenfinal-grafana-data

  elasticsearch-data:
    name: examenfinal-elasticsearch-data

  jenkins-data:
    name: examenfinal-jenkins-data